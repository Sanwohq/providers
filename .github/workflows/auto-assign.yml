name: Auto-assign reviewer

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  assign:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Request review from maintainer
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              reviewers: ['just1and0']
            });

      - name: Add labels
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const providers = new Set();
            for (const file of files) {
              const match = file.filename.match(/^providers\/([^/]+)\//);
              if (match && match[1] !== '_template') {
                providers.add(match[1]);
              }
            }

            const labels = [];
            for (const p of providers) {
              const isNew = files.some(f => f.filename === `providers/${p}/package.json` && f.status === 'added');
              labels.push(isNew ? 'new-provider' : 'update');
              labels.push(`provider:${p}`);
            }

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: labels,
              });
            }
